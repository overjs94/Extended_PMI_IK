[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-pmi-ik"
version = "0.1.0"
description = "URDF-driven PMI inverse kinematics research workbench"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "numba==0.63.1", "scipy==1.17.0", "casadi==3.7.2", "osqp==1.1.1", "defusedxml==0.7.1", "fastapi==0.141.1", "uvicorn==0.52.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
extended-pmi = "extended_pmi_ik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
